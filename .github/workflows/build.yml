name: Build VPK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR replaces the run still going for it. A tag run
# publishes a release, so it is never cancelled, and its group is its own run
# id: no other run can queue behind it or replace it while it waits.
concurrency:
  group: build-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; the one job that publishes asks for more.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    # test_hls runs threads; a deadlock must not hold the runner for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # gcc's errors and warnings, the tests' own "FAIL file:line: why" lines
      # and the sanitizers' reports become annotations: readable on the run
      # page, and through the API, without downloading the logs.
      - name: Annotate compiler and test failures
        run: echo "::add-matcher::.github/problem-matchers/host-tests.json"

      - name: Host-side tests
        run: |
          # t NAME prints the name of the test whose build and run follow, and
          # the trap names it again if any of those commands fails.
          t() { current=$1; echo "=== $1"; }
          trap 'echo "::error title=Host-side tests::${current:-setup} failed"' ERR

          t test_thai_shape
          gcc -Isrc -Wall -Werror -o /tmp/tt tests/test_thai_shape.c src/ui/thai_shape.c
          /tmp/tt
          t test_strings
          gcc -Isrc -Wall -o /tmp/ts tests/test_strings.c src/ui/strings_table.c \
              src/ui/strings_de.c src/ui/strings_en.c src/ui/strings_es.c \
              src/ui/strings_pt.c src/ui/strings_it.c src/ui/strings_fr.c
          /tmp/ts
          t test_net_retry
          gcc -Isrc -Wall -Werror -o /tmp/tnr tests/test_net_retry.c src/net/net_retry.c
          /tmp/tnr
          t test_kinetic_scroll
          gcc -Isrc -Wall -Wextra -Werror -o /tmp/tks tests/test_kinetic_scroll.c \
              src/ui/kinetic_scroll.c -lm
          /tmp/tks
          t test_local_stream
          gcc -Isrc -Wall -Wextra -Werror -o /tmp/tls tests/test_local_stream.c \
              src/media/local_stream.c
          /tmp/tls
          t test_dl_format
          gcc -Isrc -Wall -Wextra -Werror -o /tmp/tdf tests/test_dl_format.c \
              src/ui/dl_format.c
          /tmp/tdf
          t test_player_touch
          gcc -Isrc -Wall -Wextra -Werror -o /tmp/tpt tests/test_player_touch.c \
              src/ui/player_touch.c
          /tmp/tpt
          # The HLS source against a scripted server. tests/stubs stands in for
          # vita-https and the two psp2 headers it includes; the test supplies
          # the rest of the platform itself, and the worker threads are real.
          t test_hls
          gcc -Isrc -Itests/stubs -Wall -Wextra -Werror -o /tmp/thls \
              tests/test_hls.c src/media/hls.c -pthread
          /tmp/thls

          # jansson is vendored and not ours to make warning-free, so its
          # objects are built apart, without -Werror, and shared by the
          # parser tests and the download engine's below.
          t jansson
          mkdir -p /tmp/js
          for f in dump error hashtable hashtable_seed load memory pack_unpack \
                   strbuffer strconv utf value version; do
            gcc -c -w -DHAVE_CONFIG_H -Iexternal/jansson -o /tmp/js/$f.o external/jansson/$f.c
          done

          # The parsers against responses captured from the live API
          # (tests/fixtures), so a change in what they pull out of a real
          # response shows up here. The fixtures are opened by a relative
          # path, hence tests/ as the working directory.
          t test_parse
          gcc -Isrc -Iexternal/jansson -Wall -Wextra -Werror -o /tmp/tp \
              tests/test_parse.c src/yt/parse.c /tmp/js/*.o
          (cd tests && /tmp/tp)
          t "test_parse (ASan, UBSan)"
          gcc -g -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Isrc -Iexternal/jansson -Wall -Wextra -Werror -o /tmp/tp_san \
              tests/test_parse.c src/yt/parse.c /tmp/js/*.o
          (cd tests && ASAN_OPTIONS=detect_leaks=0 /tmp/tp_san)

          # The download engine against a fake card and a fake server.
          t test_dl_core
          gcc -Isrc -Iexternal/jansson -Wall -Wextra -Werror -o /tmp/tdl \
              tests/test_dl_core.c src/dl/dl_core.c src/dl/dl_index.c \
              src/dl/dl_mp4.c /tmp/js/*.o
          /tmp/tdl
          t "test_dl_core (ASan, UBSan)"
          gcc -g -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Isrc -Iexternal/jansson -Wall -Wextra -Werror -o /tmp/tdl_san \
              tests/test_dl_core.c src/dl/dl_core.c src/dl/dl_index.c \
              src/dl/dl_mp4.c /tmp/js/*.o
          ASAN_OPTIONS=detect_leaks=0 /tmp/tdl_san

  vpk:
    runs-on: ubuntu-latest
    # Pinned: the dependency cache below is only valid for the SDK it was
    # built against.
    container: vitasdk/vitasdk:2026.08-20261029
    steps:
      - name: Host tools the dependency scripts need
        # patch for the FFmpeg patches, perl for shasum.
        run: apt-get update && apt-get install -y --no-install-recommends patch perl

      - uses: actions/checkout@v4

      - name: Cache FFmpeg and curl builds
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            external/vita-hw-decoder/build/deps
            external/vita-https/build/deps
          key: deps-vitasdk-2026.08-20261029-${{ hashFiles('external/vita-hw-decoder/tools/**', 'external/vita-https/tools/build-curl-mbedtls.sh', 'external/vita-https/patches/**') }}

      - name: Build FFmpeg (h264_vita)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: external/vita-hw-decoder
        env:
          VITAWAVE_FFMPEG_JOBS: 4
        run: ./tools/build-ffmpeg.sh 2>&1 | tee /tmp/ffmpeg.log

      - name: Build curl + Mbed TLS
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: external/vita-https
        run: ./tools/build-curl-mbedtls.sh 2>&1 | tee /tmp/curl.log

      - name: Build ViTube
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/vitube.log
          cmake --build build -j4 2>&1 | tee -a /tmp/vitube.log

      - uses: actions/upload-artifact@v4
        with:
          name: ViTube-vpk
          path: build/ViTube.vpk
          if-no-files-found: error

      # The end of the failing log as an annotation: those are readable on
      # the run page, and through the API, without downloading the logs.
      - name: Report the failing log
        if: failure()
        run: |
          for f in /tmp/ffmpeg.log /tmp/curl.log /tmp/vitube.log; do
            [ -s "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done

  # A tag v* publishes the VPK it built as a GitHub release. The tag is also
  # the Corresponding Source of that VPK (GPL-3.0 s.6).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, vpk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ViTube-vpk
          path: dist
      # A fixed asset name keeps releases/latest/download/ViTube-TH.vpk working.
      - run: mv dist/ViTube.vpk dist/ViTube-TH.vpk
      # Pinned to a commit (the release of v2.6.2, which is what v2 points to
      # today): this action runs with a token that can write releases.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ViTube TH ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/ViTube-TH.vpk
          fail_on_unmatched_files: true
